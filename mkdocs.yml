site_name: The Generative AI Wiki
site_description: A dense, diagram-first reference on generative modelling for AI/ML students
site_url: https://kirito-excalibur.github.io/GenerativeAIDocs/
repo_url: https://github.com/Kirito-Excalibur/GenerativeAIDocs
repo_name: Kirito-Excalibur/GenerativeAIDocs
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: _site

hooks:
  - scripts/hooks.py

theme:
  name: material
  favicon: assets/favicon.svg
  icon:
    logo: material/graph-outline
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

nav:
  - Home: index.md
  - I · Foundations:
      - What is Generative AI?: 01-foundations/01-what-is-generative-ai.md
      - Probability & Information Theory: 01-foundations/02-probability-and-information-theory.md
      - Math Toolkit: 01-foundations/03-math-toolkit.md
      - Neural Networks Refresher: 01-foundations/04-neural-network-refresher.md
      - Optimization: 01-foundations/05-optimization.md
      - Taxonomy: 01-foundations/06-taxonomy.md
  - II · Classical Models:
      - Autoregressive Models: 02-classical-models/01-autoregressive-models.md
      - Variational Autoencoders: 02-classical-models/02-vae.md
      - GANs: 02-classical-models/03-gan.md
      - Normalizing Flows: 02-classical-models/04-normalizing-flows.md
      - Energy-Based Models: 02-classical-models/05-energy-based-models.md
  - III · Sequence Models:
      - Tokenization: 03-sequence-models/01-tokenization.md
      - RNNs, LSTMs & GRUs: 03-sequence-models/02-rnn-lstm-gru.md
      - Attention: 03-sequence-models/03-attention.md
      - The Transformer: 03-sequence-models/04-transformer.md
      - Positional Encoding: 03-sequence-models/05-positional-encoding.md
  - IV · Large Language Models:
      - LLM Architecture: 04-large-language-models/01-llm-architecture.md
      - Pretraining: 04-large-language-models/02-pretraining.md
      - Scaling Laws: 04-large-language-models/03-scaling-laws.md
      - Fine-tuning & PEFT: 04-large-language-models/04-finetuning-peft.md
      - Alignment: 04-large-language-models/05-alignment.md
      - Inference & Decoding: 04-large-language-models/06-inference-and-decoding.md
      - Efficiency: 04-large-language-models/07-efficiency.md
      - Mixture of Experts: 04-large-language-models/08-mixture-of-experts.md
      - Long Context: 04-large-language-models/09-long-context.md
      - Reasoning: 04-large-language-models/10-reasoning.md
  - V · Diffusion & Vision:
      - Diffusion Models: 05-diffusion-and-vision/01-diffusion-models.md
      - Score-Based Models & SDEs: 05-diffusion-and-vision/02-score-based-models.md
      - Latent Diffusion: 05-diffusion-and-vision/03-latent-diffusion.md
      - Flow Matching: 05-diffusion-and-vision/04-flow-matching.md
      - Vision & Multimodal: 05-diffusion-and-vision/05-multimodal.md
  - VI · Applications:
      - Prompt Engineering: 06-applications/01-prompt-engineering.md
      - Embeddings & Vector Search: 06-applications/02-embeddings-and-vector-search.md
      - RAG: 06-applications/03-rag.md
      - Agents & Tool Use: 06-applications/04-agents-and-tool-use.md
      - Structured Output: 06-applications/05-structured-output.md
  - VII · Evaluation:
      - Metrics: 07-evaluation/01-metrics.md
      - Benchmarks: 07-evaluation/02-benchmarks.md
  - VIII · Safety & Ethics:
      - Alignment & Safety: 08-safety-and-ethics/01-safety.md
      - Security: 08-safety-and-ethics/02-security.md
      - Societal Impact: 08-safety-and-ethics/03-societal-impact.md
  - IX · Reference:
      - Glossary: 09-reference/01-glossary.md
      - Math Cheatsheet: 09-reference/02-math-cheatsheet.md
      - Timeline: 09-reference/03-timeline.md
      - Papers: 09-reference/04-papers.md
      - Study Roadmap: 09-reference/05-roadmap.md
